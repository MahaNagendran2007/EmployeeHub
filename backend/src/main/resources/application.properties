spring.application.name=employeehub

# --- Runtime settings (override with environment variables; see ../.env.example) ---
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/employeehub}
# Creates the unique indexes declared with @Indexed on startup. Boot disables this by default.
spring.data.mongodb.auto-index-creation=true

# Comma-separated list of browser origins allowed to call /api/**
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.pagination.max-page-size=100

# --- Security (set these as environment variables; never commit real values) ---
# HS256 signing secret, at least 32 characters. If empty, a random secret is generated at startup
# (login tokens then stop working whenever the backend restarts).
app.security.jwt-secret=${EMPLOYEEHUB_JWT_SECRET:}
app.security.jwt-ttl-minutes=${EMPLOYEEHUB_JWT_TTL_MINUTES:60}
# One-time bootstrap of the first ADMIN account (only used when no users exist yet).
app.bootstrap.admin-username=${EMPLOYEEHUB_ADMIN_USERNAME:}
app.bootstrap.admin-password=${EMPLOYEEHUB_ADMIN_PASSWORD:}

# --- CSV import limits ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.import.max-rows=1000

# --- Error output: never leak internals ---
server.error.include-stacktrace=never
server.error.include-message=never

# --- Actuator: expose only health and info ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.employeehub=INFO
